[pytest]
testpaths = tests
pythonpath = .. .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --strict-markers 
    --tb=short
    --durations=10
markers =
    tier1: Unit and isolated feature tests (A1, A2, A3, R1-R6)
    tier2: Boundary, edge case, and negative security tests
    tier3: Cross-feature integration tests
    tier4: Real-world workflow tests
    sla: Tests that enforce execution time latency thresholds
    offline: Tests verifying offline mock execution without API keys
