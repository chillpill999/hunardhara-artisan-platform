services:
  - type: web
    name: hunardhara-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OFFLINE_MODE
        value: "true"
      - key: MOCK_AI_SERVICES
        value: "true"
      - key: STATIC_DIR
        value: /app/static
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: AADHAAR_PEPPER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
